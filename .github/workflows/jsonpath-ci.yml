name: JSONPath integration branch CI

# Baseline CI for the `jsonpath` integration branch.
# The unchanged JSON-P TCK (jakarta.json-tck-tests and -tests-pluggability 2.1.1) is wired into johnzon-core/pom.xml
# (surefire executions tck-test and tck-test-pluggability), so `mvn verify` on johnzon-core runs it.
on:
  push:
    branches: [ jsonpath ]
  pull_request:
    branches: [ jsonpath ]

concurrency:
  group: jsonpath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-tck:
    name: johnzon-core + JSON-P TCK on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '11', '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Verify johnzon-core (unit tests + TCK)
        run: mvn -V -B verify -pl johnzon-core -am --no-transfer-progress
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports-jdk${{ matrix.jdk }}
          path: johnzon-core/target/surefire-reports
          if-no-files-found: ignore

  full-build:
    # JDK 11 is not possible for the full build: johnzon-jsonb test dependencies (OpenWebBeans) need Java 17+.
    # JDK 25: JSON-B TCK NumberFormatCustomizationTest fails on this JDK with unchanged code (locale data), excluded here.
    name: Full build on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Maven package
        env:
          MAVEN_OPTS: -Dmaven.artifact.threads=64
        run: mvn -V -B package --no-transfer-progress ${{ matrix.jdk == '25' && '-Dtest=!NumberFormatCustomizationTest -Dsurefire.failIfNoSpecifiedTests=false' || '' }}

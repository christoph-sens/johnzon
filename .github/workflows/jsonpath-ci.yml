name: JSONPath integration branch CI

# Baseline CI for the `jsonpath` integration branch.
# The unchanged JSON-P TCK (jakarta.json-tck-tests and -tests-pluggability 2.1.1) is wired into johnzon-core/pom.xml
# (surefire executions tck-test and tck-test-pluggability), so `mvn verify` on johnzon-core runs it. Its signature test is
# excluded: it requires the package jakarta.json to have exactly the 2.1 signature, and API 2.2 adds JsonPath,
# Json.createPath and JsonProvider.createPath. The 2.2 signature is checked by the TCK in christoph-sens/jsonp-api, which
# also runs the JSONPath tests against this branch.
#
# The branch implements JSONPath (RFC 9535) against the JSON-P API 2.2.0-SNAPSHOT from christoph-sens/jsonp-api, branch
# jsonpath, which is not published anywhere; each job builds and installs it first. The API is compiled for Java 17,
# so Johnzon is compiled for Java 17 on this branch and JDK 11 is not in the matrix.
on:
  push:
    branches: [ jsonpath ]
  pull_request:
    branches: [ jsonpath ]

concurrency:
  group: jsonpath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-tck:
    name: johnzon-core + JSON-P TCK on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the JSON-P API with JSONPath (christoph-sens/jsonp-api, branch jsonpath)
        uses: actions/checkout@v4
        with:
          repository: christoph-sens/jsonp-api
          ref: jsonpath
          path: jsonp-api
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Build and install JSON-P API 2.2.0-SNAPSHOT
        run: mvn -B -V -U -C -f jsonp-api/api/pom.xml -Poss-release install -DskipTests -Dgpg.skip=true --no-transfer-progress
      - name: Verify johnzon-core (unit tests + TCK)
        run: mvn -V -B verify -pl johnzon-core -am --no-transfer-progress
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports-jdk${{ matrix.jdk }}
          path: johnzon-core/target/surefire-reports
          if-no-files-found: ignore

  full-build:
    # JDK 11 is not possible for the full build: johnzon-jsonb test dependencies (OpenWebBeans) need Java 17+.
    # JDK 25: JSON-B TCK NumberFormatCustomizationTest (locale data) and johnzon-websocket JsrCodecTest/MapperCodecTest fail with unchanged code, tolerated here (all other failures still fail the job).
    name: Full build on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the JSON-P API with JSONPath (christoph-sens/jsonp-api, branch jsonpath)
        uses: actions/checkout@v4
        with:
          repository: christoph-sens/jsonp-api
          ref: jsonpath
          path: jsonp-api
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Build and install JSON-P API 2.2.0-SNAPSHOT
        run: mvn -B -V -U -C -f jsonp-api/api/pom.xml -Poss-release install -DskipTests -Dgpg.skip=true --no-transfer-progress
      - name: Maven package
        env:
          MAVEN_OPTS: -Dmaven.artifact.threads=64
        run: mvn -V -B package --no-transfer-progress ${{ matrix.jdk == '25' && '-Dmaven.test.failure.ignore=true' || '' }}
      - name: JDK 25 - only known JDK 25 failures may remain
        if: matrix.jdk == '25'
        run: |
          bad=$(grep -rlE '(<failure|<error)' --include='TEST-*.xml' . | grep -vE 'NumberFormatCustomizationTest|JsrCodecTest|MapperCodecTest' || true)
          if [ -n "$bad" ]; then echo "Unexpected failures:"; echo "$bad"; exit 1; fi

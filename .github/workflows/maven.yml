name: Maven

# Upstream workflow for master. The jsonpath integration line is built by jsonpath-ci.yml: it needs the JSON-P API
# 2.2.0-SNAPSHOT, which is not published and which that workflow builds first.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Test with Java ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21' ]
        dist: [ 'zulu' ]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: ${{ matrix.dist }}
          cache: 'maven'

      - name: Maven Package
        env:
          MAVEN_OPTS: -Dmaven.artifact.threads=64
        run: mvn -V package --no-transfer-progress
